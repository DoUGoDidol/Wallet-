<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="零花钱管家"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>零花钱管家</title><style>
:root{color-scheme:dark;--bg:#0b1020;--p:#141d30;--p2:#1b2940;--line:#30405a;--text:#eef3fb;--muted:#a5b1c5;--blue:#9ab2ff;--mint:#66dfc1;--red:#ff899d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:auto}header{padding:18px 2px;display:flex;align-items:center;gap:12px}.logo{font-size:25px;background:#202d45;padding:12px;border-radius:14px}h1{font-size:20px;margin:0}header p,.muted,.label{color:var(--muted);font-size:12px}header p{margin:4px 0}.panel{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0}.hero{background:#172239}.big{font-size:31px;font-weight:800;margin:7px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--p2);padding:12px;border-radius:13px;border:1px solid var(--line)}.tile h3{font-size:13px}.money{font-size:18px;font-weight:750}.bar{height:7px;background:#2b3850;border-radius:99px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:var(--blue)}.title{font-size:16px;margin:18px 2px 8px}.btn{border:0;border-radius:11px;background:var(--blue);color:#111a2b;font-weight:750;padding:12px;font-size:14px}.secondary{background:#26334a;color:var(--text);border:1px solid #40506a}.danger{background:#482631;color:#ffdce3}.full{width:100%;margin-top:10px}.small{padding:7px 9px;font-size:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;gap:3px;background:#0c1324f5;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:3}.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:8px 2px;border-radius:9px}.tabs button.active{background:#26344e;color:white}.tabs span{display:block;font-size:18px}input,select,textarea{width:100%;background:#0d1424;color:var(--text);border:1px solid #394963;border-radius:10px;padding:12px;font:inherit;font-size:14px}label{display:block;color:var(--muted);font-size:12px;margin:11px 0 6px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.entry{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #2a364b}.entrymain{flex:1;min-width:0}.entrymain strong{font-size:13px;display:block;overflow-wrap:anywhere}.entrymain small,.smalltext{font-size:11px;color:var(--muted);line-height:1.5}.amt{color:#ffabb8;font-weight:700}.note{background:#142b2b;border:1px solid #315b55;border-radius:11px;padding:11px;font-size:12px;line-height:1.5}.empty{text-align:center;padding:20px;color:var(--muted);font-size:13px}.login{min-height:85vh;display:grid;place-items:center}.loginbox{width:100%;max-width:390px;text-align:center}.hidden{display:none}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="root"></div><script>
const LOGIN={user:'Evan Yang',pass:'Yang20120114'};const BASE={total:1830,weekly:35,start:new Date().toISOString().slice(0,10),carry:true,cats:[['游戏',550,'🎮'],['零食',480,'🍪'],['大件储蓄',500,'🎯'],['自由与备用',300,'👛']],entries:[],goals:[]};let S=load(),tab='home',edit=null;function load(){try{let x=JSON.parse(localStorage.getItem('wallet-v2'));return x&&x.cats?x:structuredClone(BASE)}catch{return structuredClone(BASE)}}function save(){localStorage.setItem('wallet-v2',JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function $$(n){return 'C$'+Number(n||0).toFixed(2)}function today(){return new Date().toISOString().slice(0,10)}function date(s){return new Date(s+'T12:00:00')}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function bounds(d=today()){let x=date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));let y=new Date(x);y.setDate(y.getDate()+6);return [ymd(x),ymd(y)]}function sum(a){return a.reduce((s,x)=>s+x.amount,0)}function expenses(){return sum(S.entries.filter(e=>e.type==='expense'))}function income(){return sum(S.entries.filter(e=>e.type==='income'))}function balance(){return S.total+income()-expenses()}function catspent(n){return sum(S.entries.filter(e=>e.type==='expense'&&e.cat===n))}function inweek(e,d=today()){let [a,b]=bounds(d);return e.date>=a&&e.date<=b}function weekdaily(d=today()){return sum(S.entries.filter(e=>e.type==='expense'&&e.kind!=='big'&&inweek(e,d)))}function monthspent(){return sum(S.entries.filter(e=>e.type==='expense'&&e.date.slice(0,7)===today().slice(0,7)))}function carry(d=today()){if(!S.carry)return 0;let [start]=bounds(d),cur=date(start),credit=0;for(let i=0;i<52;i++){cur.setDate(cur.getDate()-7);let [a,b]=bounds(ymd(cur));if(b<S.start)break;let used=sum(S.entries.filter(e=>e.type==='expense'&&e.kind!=='big'&&e.date>=a&&e.date<=b));credit+=Math.max(0,S.weekly-used)}return Math.min(credit,S.total)}function weekleft(d=today()){return Math.max(0,S.weekly+carry(d)-weekdaily(d))}function login(){root.innerHTML=`<div class="login"><section class="panel loginbox"><div class="logo">◈</div><h1>零花钱管家</h1><p class="muted">本机账本 · CAD</p><form id="lf"><label>用户名</label><input id="u" autocomplete="username" required><label>密码</label><input id="p" type="password" autocomplete="current-password" required><button class="btn full">解锁</button><p id="err" class="smalltext"></p></form><p class="smalltext">安全提示：这是本地门禁，密码写在网页代码里，不是安全认证。不要用来保护敏感数据。</p></section></div>`;lf.onsubmit=e=>{e.preventDefault();if(u.value===LOGIN.user&&p.value===LOGIN.pass){sessionStorage.ok='1';render()}else err.textContent='用户名或密码错误'} }
function render(){if(sessionStorage.ok!=='1')return login();root.innerHTML=`<header><div class="logo">◈</div><div style="flex:1"><h1>零花钱管家</h1><p>简洁深色 · 加币 CAD</p></div><button class="btn secondary small" id="lock">锁定</button></header><main id="app"></main><nav class="tabs">${[['home','⌂','总览'],['ledger','▤','账本'],['add','＋','记账'],['goals','◎','大件'],['settings','⚙','设置']].map(a=>`<button data-t="${a[0]}" class="${tab===a[0]?'active':''}"><span>${a[1]}</span>${a[2]}</button>`).join('')}</nav>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;edit=null;render()});lock.onclick=()=>{sessionStorage.removeItem('ok');render()};app.innerHTML=tab==='home'?home():tab==='ledger'?ledger():tab==='add'?form():tab==='goals'?goals():settings();wire()}
function home(){let [a,b]=bounds(),spent=expenses(),bal=balance(),w=weekdaily(),left=weekleft();return `<section class="panel hero"><div class="label">全年实际余额</div><div class="big">${$$(bal)}</div><div class="row"><span class="muted">总预算 ${$$(S.total)}</span><span class="muted">累计支出 ${$$(spent)}</span></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,spent/S.total*100))}%"></span></div><p class="smalltext">余额=基础预算+额外收入−所有支出。分类额度只是预算分配，不会重复增加总余额。</p></section><section class="panel"><div class="row"><div><div class="label">本周日常可用</div><div class="big">${$$(left)}</div></div><div style="text-align:right"><div class="label">每周上限</div><div class="money">${$$(S.weekly)}</div></div></div><div class="row"><span class="muted">${a} 至 ${b}</span><span class="muted">本周日常已花 ${$$(w)}</span></div><div class="bar"><span style="width:${Math.min(100,w/S.weekly*100)}%;background:var(--mint)"></span></div><div class="note">${left===0?'本周日常额度已用完；可以等待下周或检查记录。大件购买走独立流程。':`平均到本周剩余天数，参考每天最多花 C$${(left/Math.max(1,7-(new Date().getDay()+6)%7)).toFixed(2)}。不必每天花满。`}</div><p class="smalltext">周预算按周一至周日。结转仅使用之前未花完的额度；大件不计入周上限，但仍受全年余额和分类额度限制。</p></section><h2 class="title">分类年度额度</h2><div class="grid">${S.cats.map(c=>`<div class="tile"><div>${c[2]} ${c[0]}</div><div class="money">${$$(Math.max(0,c[1]-catspent(c[0])))}</div><div class="muted">剩余 / ${$$(c[1])}</div><div class="bar"><span style="width:${Math.min(100,catspent(c[0])/c[1]*100)}%"></span></div><div class="muted">已花 ${$$(catspent(c[0]))}</div></div>`).join('')}</div><h2 class="title">本月分析</h2><section class="panel"><div class="row"><div><div class="label">本月消费</div><div class="big">${$$(monthspent())}</div></div><span class="chip">${today().slice(0,7)}</span></div><canvas id="chart" width="650" height="160" style="width:100%;height:150px"></canvas><div class="note">${summary()}</div></section><h2 class="title">最近记录</h2><section class="panel">${rows([...S.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</section>`}
function summary(){let a=S.cats.map(c=>[c[0],sum(S.entries.filter(e=>e.type==='expense'&&e.cat===c[0]&&e.date.slice(0,7)===today().slice(0,7)))]).sort((x,y)=>y[1]-x[1]);return a[0][1]?`本月消费最多的分类是「${a[0][0]}」，支出 ${$$(a[0][1])}。本周日常预算还剩 ${$$(weekleft())}。`: '本月还没有消费记录。记账后会自动更新分析。'}function rows(arr){return arr.length?arr.map(e=>`<div class="entry"><div>${e.type==='income'?'＋':S.cats.find(c=>c[0]===e.cat)?.[2]||'•'}</div><div class="entrymain"><strong>${esc(e.note)}</strong><small>${e.date} · ${esc(e.cat)}${e.kind==='big'?' · 大件':''}</small></div><div class="amt">${e.type==='income'?'+':'−'}${$$(e.amount)}</div><button class="btn secondary small" data-edit="${e.id}">改</button><button class="btn danger small" data-del="${e.id}">删</button></div>`).join(''):'<div class="empty">没有记录</div>'}
function ledger(){return `<h2 class="title">历史账本</h2><section class="panel"><div class="formgrid"><div><div class="label">本周日常</div><div class="money">${$$(weekdaily())}</div></div><div><div class="label">本月支出</div><div class="money">${$$(monthspent())}</div></div></div><label>搜索</label><input id="q" placeholder="商品名称或备注"><div class="formgrid"><div><label>分类</label><select id="fc"><option value="">全部</option>${S.cats.map(c=>`<option>${c[0]}</option>`).join('')}</select></div><div><label>月份</label><input type="month" id="fm" value="${today().slice(0,7)}"></div></div><div id="list"></div></section>`}
function form(){let e=edit?S.entries.find(x=>x.id===edit):null;return `<h2 class="title">${e?'编辑记录':'新增记录'}</h2><section class="panel"><form id="ef"><label>类型</label><select id="type"><option value="expense" ${e?.type!=='income'?'selected':''}>消费</option><option value="income" ${e?.type==='income'?'selected':''}>额外收入</option></select><label>名称</label><input id="note" required value="${esc(e?.note||'')}" placeholder="例如：游戏皮肤"><div class="formgrid"><div><label>金额（CAD）</label><input id="amount" type="number" min=".01" step=".01" required value="${e?.amount??''}"></div><div><label>日期</label><input id="date" type="date" required value="${e?.date||today()}"></div></div><label>分类</label><select id="cat">${S.cats.map(c=>`<option ${((e?.cat||'游戏')===c[0])?'selected':''}>${c[0]}</option>`).join('')}</select><label>购买类型</label><select id="kind"><option value="daily" ${e?.kind!=='big'?'selected':''}>日常（占周预算）</option><option value="big" ${e?.kind==='big'?'selected':''}>大件（不占周预算）</option></select><label>备注</label><textarea id="memo" rows="2">${esc(e?.memo||'')}</textarea><div id="preview" class="note">输入金额查看购买影响。</div><button class="btn full">${e?'保存修改':'保存记录'}</button>${e?'<button type="button" id="cancel" class="btn secondary full">取消</button>':''}</form></section>`}
function goals(){return `<h2 class="title">大件目标与购买模拟</h2><section class="panel"><form id="gf"><label>目标名称</label><input id="gn" required placeholder="游戏手柄"><div class="formgrid"><div><label>目标价格（C$）</label><input id="gp" type="number" min=".01" step=".01" required></div><div><label>已攒（C$）</label><input id="gs" type="number" min="0" value="0" required></div></div><button class="btn full">添加目标</button></form></section>${S.goals.map(g=>`<section class="panel"><div class="row"><b>◎ ${esc(g.name)}</b><button class="btn danger small" data-gdel="${g.id}">删除</button></div><p class="muted">目标 ${$$(g.price)} · 已攒 ${$$(g.saved)} · 还差 ${$$(Math.max(0,g.price-g.saved))}</p><div class="bar"><span style="width:${Math.min(100,g.saved/g.price*100)}%;background:var(--mint)"></span></div><button class="btn secondary small" data-gadd="${g.id}">增加储蓄</button></section>`).join('')}<section class="panel"><h3>购买模拟器（不会记账）</h3><label>商品名称</label><input id="sn" placeholder="例如：游戏设备"><label>价格（C$）</label><input id="sp" type="number" min=".01" step=".01" placeholder="1280"><label>从哪个分类付款</label><select id="sc">${S.cats.map(c=>`<option>${c[0]}</option>`).join('')}</select><button class="btn full" id="sim" type="button">模拟购买</button><div id="sr" class="note" style="margin-top:10px">会检查总余额和分类额度，不会实际扣钱。</div><h3>替代方案</h3><p class="smalltext">游戏皮肤：等待官方折扣或选择免费外观。手柄/耳机：比较旧款、有线款、官方翻新和可信二手。游戏机：先看现有设备是否够用；二手交易请家长协助。此处不提供实时价格。</p></section>`}
function settings(){return `<h2 class="title">设置与备份</h2><section class="panel"><form id="sf"><label>预算开始日期</label><input id="start" type="date" value="${S.start}" required><label>全年预算（CAD）</label><input id="total" type="number" min=".01" step=".01" value="${S.total}" required><label>每周日常上限（CAD）</label><input id="weekly" type="number" min="0" step=".01" value="${S.weekly}" required><label><input id="carry" type="checkbox" style="width:auto" ${S.carry?'checked':''}> 未使用周预算结转</label><button class="btn full">保存设置</button></form><p class="smalltext">初始分类额度合计 C$1,830。改变总预算不会自动改变分类额度。</p></section><section class="panel"><button class="btn full" id="export">导出 JSON 备份</button><label>导入备份</label><input type="file" id="import" accept="application/json"><button class="btn danger full" id="clear">清空全部记录</button><p class="smalltext">数据保存在此设备浏览器 localStorage，不会自动同步。请定期备份。</p><p class="smalltext">登录门禁仅用于防止随手打开，密码在 HTML 源代码中，不适合保护敏感数据。真正安全登录需要服务器端认证。</p></section><section class="panel"><b>iPhone 安装</b><p class="smalltext">把文件部署到 HTTPS 网站，用 Safari 打开 → 分享 → 添加到主屏幕。首次联网后可离线打开。</p></section>`}
function wire(){if(tab==='home')drawChart();if(tab==='ledger'){let fill=()=>{let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('fc').value,m=document.getElementById('fm').value;document.getElementById('list').innerHTML=rows([...S.entries].filter(e=>(!q||(e.note+' '+e.memo).toLowerCase().includes(q))&&(!c||e.cat===c)&&(!m||e.date.startsWith(m))).sort((a,b)=>b.date.localeCompare(a.date)))};['q','fc','fm'].forEach(id=>document.getElementById(id).addEventListener('input',fill));fill()}if(tab==='add'){let upd=()=>{let amt=Number(amount.value)||0,cat=catspent(document.getElementById('cat').value),isBig=kind.value==='big',weekAfter=weekleft(date.value)-(isBig?0:amt);preview.textContent=`预计总余额：${$$(balance()-(type.value==='expense'?amt:0))}；分类剩余参考：${$$(S.cats.find(c=>c[0]===document.getElementById('cat').value)[1]-cat-(type.value==='expense'?amt:0))}；${isBig?'大件不占每周额度。':'本周日常额度预计剩余 '+$$(weekAfter)+'。'}`};['amount','cat','kind','type','date'].forEach(id=>document.getElementById(id).addEventListener('input',upd));upd();ef.onsubmit=e=>{e.preventDefault();let typev=type.value,amt=Math.round(Number(amount.value)*100)/100,catv=document.getElementById('cat').value,datev=date.value,kindv=kind.value,old=edit?S.entries.find(x=>x.id===edit):null,others=S.entries.filter(x=>x.id!==old?.id),total=S.total+sum(others.filter(x=>x.type==='income'))-sum(others.filter(x=>x.type==='expense'))+(typev==='income'?amt:-amt);if(amt<=0)return alert('请输入有效金额');if(typev==='expense'&&total<0)return alert('总余额不足，已阻止记账。购买后余额会是 '+$$(total));let c=S.cats.find(c=>c[0]===catv),used=sum(others.filter(x=>x.type==='expense'&&x.cat===catv));if(typev==='expense'&&amt>c[1]-used)return alert(`分类额度不足。${catv}可用 ${$$(Math.max(0,c[1]-used))}，本次 ${$$(amt)}。`);if(typev==='expense'&&kindv!=='big'&&inweek({date:datev},datev)){let usedw=sum(others.filter(x=>x.type==='expense'&&x.kind!=='big'&&inweek(x,datev))),cap=S.weekly+carry(datev);if(usedw+amt>cap)return alert(`本周日常预算不足，可用约 ${$$(Math.max(0,cap-usedw))}。大件请选择大件类型，但仍需满足总余额和分类额度。`)}let item={id:old?old.id:Date.now(),type:typev,amount:amt,cat:catv,date:datev,kind:typev==='expense'?kindv:'none',note:note.value.trim()||catv,memo:memo.value.trim()};if(old)S.entries=S.entries.map(x=>x.id===old.id?item:x);else S.entries.push(item);save();edit=null;tab='home';render()};if(cancel)cancel.onclick=()=>{edit=null;tab='ledger';render()}}if(tab==='goals'){gf.onsubmit=e=>{e.preventDefault();S.goals.push({id:Date.now(),name:gn.value.trim(),price:Number(gp.value),saved:Number(gs.value)});save();render()};document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{S.goals=S.goals.filter(g=>g.id!==Number(b.dataset.gdel));save();render()});document.querySelectorAll('[data-gadd]').forEach(b=>b.onclick=()=>{let g=S.goals.find(x=>x.id===Number(b.dataset.gadd)),n=prompt('新增已攒金额（CAD）','10');if(n!==null&&Number(n)>0){g.saved+=Number(n);save();render()}});sim.onclick=()=>{let p=Number(sp.value)||0,c=S.cats.find(c=>c[0]===sc.value),left=c[1]-catspent(c[0]);sr.textContent=p<=0?'请输入有效价格。':`模拟购买「${sn.value||'商品'}」：总余额购买后 ${$$(balance()-p)}；${c[0]}额度购买后 ${$$(left-p)}。${p<=balance()&&p<=left?'总余额与分类额度都足够，但请确认这笔购买值得。':'不建议购买：总余额或分类额度不足。可以等待折扣、选择旧款/二手或继续储蓄。'}此操作不会记账。`}}if(tab==='settings'){sf.onsubmit=e=>{e.preventDefault();S.start=start.value;S.total=Number(total.value);S.weekly=Number(weekly.value);S.carry=carry.checked;save();render();alert('已保存')};export.onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=u;a.download='零花钱管家-CAD-备份.json';a.click();URL.revokeObjectURL(u)};document.getElementById('import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.entries)||!Array.isArray(x.cats))throw 0;if(confirm('导入将覆盖当前数据，继续？')){S=x;save();render()}}catch{alert('备份文件无效')}};clear.onclick=()=>{if(confirm('确定删除所有账目和目标？')){S.entries=[];S.goals=[];save();render()}}}document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=Number(b.dataset.edit);tab='add';render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这笔记录？')){S.entries=S.entries.filter(x=>x.id!==Number(b.dataset.del));save();render()}})}function drawChart(){let c=document.getElementById('chart');if(!c)return;let x=c.getContext('2d'),vals=Array(new Date().getDate()).fill(0);S.entries.filter(e=>e.type==='expense'&&e.date.slice(0,7)===today().slice(0,7)).forEach(e=>vals[Number(e.date.slice(8,10))-1]+=e.amount);x.clearRect(0,0,c.width,c.height);let max=Math.max(10,...vals),bw=(c.width-35)/vals.length;vals.forEach((v,i)=>{x.fillStyle='#9ab2ff';x.fillRect(20+i*bw,c.height-20-v/max*(c.height-40),Math.max(2,bw-2),v/max*(c.height-40))});x.fillStyle='#a5b1c5';x.font='12px sans-serif';x.fillText('每日消费（CAD）',10,14)}if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
